name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  sqlite-integration:
    runs-on: ubuntu-latest
    env:
      DB_DRIVER: sqlite
      DATABASE_URL: ./data/ci.db
      AUTO_MIGRATE: "true"
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: CiAdmin#2026
      SMOKE_PASSWORD: CiAdmin#2026
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
      NODE_ENV: test
      RATE_LIMIT_MAX: "10000"
      RATE_LIMIT_LOGIN_MAX: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:seed
      - run: npm run test:transaction
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          install-dependencies: true
      - name: Run SQLite integration tests
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          SMOKE_WEB_BASE: http://127.0.0.1:5173/
        run: |
          set -euo pipefail
          cleanup() {
            kill "${api_pid:-}" "${web_pid:-}" 2>/dev/null || true
          }
          trap cleanup EXIT
          npm start > /tmp/api.log 2>&1 &
          api_pid=$!
          npm run dev:web > /tmp/web.log 2>&1 &
          web_pid=$!
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/ready >/dev/null && curl -fsS http://localhost:5173/ >/dev/null; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              cat /tmp/api.log
              cat /tmp/web.log
              exit 1
            fi
            sleep 1
          done
          npm run smoke
          npm run smoke:regression-fixes
          npm run ui:check
          npm run ui:regression-fixes
          npm run test:rate-limit

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dw_console
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dw_console"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dw_console
      AUTO_MIGRATE: "true"
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: CiAdmin#2026
      SMOKE_PASSWORD: CiAdmin#2026
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
      NODE_ENV: test
      RATE_LIMIT_MAX: "10000"
      RATE_LIMIT_LOGIN_MAX: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:transaction
      - name: Run PostgreSQL integration tests
        run: |
          set -euo pipefail
          cleanup() {
            kill "${api_pid:-}" 2>/dev/null || true
          }
          trap cleanup EXIT
          npm start > /tmp/api-pg.log 2>&1 &
          api_pid=$!
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/ready >/dev/null; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              cat /tmp/api-pg.log
              exit 1
            fi
            sleep 1
          done
          npm run smoke
          npm run smoke:regression-fixes
          npm run test:rate-limit
