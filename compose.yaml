name: dw-resource-console

services:
  db-init:
    image: ${IMAGE_PREFIX:-dw-resource-console}-api:${IMAGE_TAG:-1.0.0}
    build:
      context: .
      target: api
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
    entrypoint: ["/bin/sh", "/usr/local/bin/db-init.sh"]
    volumes:
      - ./import:/import:ro
    networks:
      - app

  api:
    image: ${IMAGE_PREFIX:-dw-resource-console}-api:${IMAGE_TAG:-1.0.0}
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8787
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      TRUST_PROXY: "true"
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8787"
    networks:
      - app
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ${IMAGE_PREFIX:-dw-resource-console}-web:${IMAGE_TAG:-1.0.0}
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - app

networks:
  app:
    ipam:
      config:
        - subnet: "${DOCKER_SUBNET:-172.28.0.0/24}"
